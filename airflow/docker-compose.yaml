version: '3'
x-airflow-common:
  &airflow-common
  image: airflow_image
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
    - AIRFLOW__CORE__FERNET_KEY=FB0o_zt4e3Ziq3LdUUO7F2Z95cvFFx16hU8jTeR1ASM=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__LOGGING_LEVEL=INFO
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    - postgres
  networks:
    - airflow-net
    - elt-net

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=airflow
    volumes:
      - ./docker-init-scripts/postgres:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - airflow-net

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command: -c 'airflow db init && airflow users create --username airflow --password airflow --firstname Bagas --lastname Marin --role Admin --email admin@example.org'

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    container_name: airflow_webserver
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    container_name: airflow_scheduler
    restart: always

  # MySQL service used by dags/test_connection.py
  mysql:
    image: mysql:8
    container_name: airflow_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=airflow
      - MYSQL_DATABASE=target_db
      - MYSQL_USER=airflow
      - MYSQL_PASSWORD=airflow
    volumes:
      - ./docker-init-scripts/mysql:/docker-entrypoint-initdb.d:ro
      - mysqldata:/var/lib/mysql
    networks:
        - airflow-net

networks:
  airflow-net:
    driver: bridge
  elt-net:
    external: true
    name: elt_pipeline_elt-net

volumes:
  mysqldata:
  pgdata:
